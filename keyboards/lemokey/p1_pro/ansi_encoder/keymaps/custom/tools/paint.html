<!doctype html>
<meta charset="utf-8">
<title>Подсветка по слоям — Lemokey P1 Pro</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1f232b;
    --edge: #333a45;
    --text: #e6e9ef;
    --dim: #8b94a3;
    --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 16px; font-weight: 600; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 7px 13px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .layers button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { display: flex; align-items: center; gap: 6px; }
  input[type=color] {
    width: 44px; height: 32px; padding: 0;
    background: none; border: 1px solid var(--edge); border-radius: 6px; cursor: pointer;
  }
  .swatches { display: flex; gap: 6px; }
  .swatch {
    width: 28px; height: 28px; border-radius: 6px;
    border: 2px solid transparent; cursor: pointer;
  }
  .swatch.on { border-color: #fff; }

  #board {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 14px;
    overflow-x: auto;
  }
  #keys { position: relative; }
  .key {
    position: absolute;
    border: 1px solid #000;
    border-radius: 5px;
    background: #2a2f38;
    color: #f0f0f0;
    font-size: 10px;
    line-height: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    overflow: hidden;
    user-select: none;
    padding: 1px;
  }
  .key.dark { color: #d8d8d8; }
  .key.light { color: #111; }
  .key:hover { outline: 2px solid var(--accent); z-index: 2; }

  #log {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 8px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    color: var(--dim);
    min-height: 42px;
  }
  .hint { color: var(--dim); font-size: 13px; }
  .off { color: #ff7676; }
</style>

<h1>Подсветка по слоям — Lemokey P1 Pro</h1>

<div class="row">
  <button id="connect" class="primary">Подключить клавиатуру</button>
  <span class="hint">Слой:</span>
  <span class="layers" id="layers"></span>
  <label><input type="checkbox" id="custom" disabled> своя раскраска для слоя</label>
</div>

<div class="row">
  <span class="hint">Кисть:</span>
  <span class="swatches" id="swatches"></span>
  <input type="color" id="color" value="#ff0000">
  <button id="fromKeymap" disabled>Только назначенные</button>
  <button id="clear" disabled>Погасить всё</button>
  <button id="read" disabled>Прочитать с клавиатуры</button>
  <button id="write" class="primary" disabled>Записать и сохранить</button>
</div>

<div id="board"><div id="keys"></div></div>
<div class="hint" style="margin-top:8px">
  Левая кнопка — покрасить, правая — погасить. Изменения уходят в клавиатуру только по «Записать и сохранить».
</div>
<div id="log">Не подключено.</div>

<script>
const KEYS = [[0,0,1,0,0],[1.25,0,1,0,1],[2.25,0,1,0,2],[3.25,0,1,0,3],[4.25,0,1,0,4],[5.5,0,1,0,5],[6.5,0,1,0,6],[7.5,0,1,0,7],[8.5,0,1,0,8],[9.75,0,1,0,9],[10.75,0,1,0,10],[11.75,0,1,0,11],[12.75,0,1,0,12],[14,0,1,0,13],[15.25,0,1,0,14],[0,1.25,1,1,0],[1,1.25,1,1,1],[2,1.25,1,1,2],[3,1.25,1,1,3],[4,1.25,1,1,4],[5,1.25,1,1,5],[6,1.25,1,1,6],[7,1.25,1,1,7],[8,1.25,1,1,8],[9,1.25,1,1,9],[10,1.25,1,1,10],[11,1.25,1,1,11],[12,1.25,1,1,12],[13,1.25,2,1,13],[15.25,1.25,1,1,14],[0,2.25,1.5,2,0],[1.5,2.25,1,2,1],[2.5,2.25,1,2,2],[3.5,2.25,1,2,3],[4.5,2.25,1,2,4],[5.5,2.25,1,2,5],[6.5,2.25,1,2,6],[7.5,2.25,1,2,7],[8.5,2.25,1,2,8],[9.5,2.25,1,2,9],[10.5,2.25,1,2,10],[11.5,2.25,1,2,11],[12.5,2.25,1,2,12],[13.5,2.25,1.5,2,13],[15.25,2.25,1,2,14],[0,3.25,1.75,3,0],[1.75,3.25,1,3,1],[2.75,3.25,1,3,2],[3.75,3.25,1,3,3],[4.75,3.25,1,3,4],[5.75,3.25,1,3,5],[6.75,3.25,1,3,6],[7.75,3.25,1,3,7],[8.75,3.25,1,3,8],[9.75,3.25,1,3,9],[10.75,3.25,1,3,10],[11.75,3.25,1,3,11],[12.75,3.25,2.25,3,13],[15.25,3.25,1,3,14],[0,4.25,2.25,4,0],[2.25,4.25,1,4,2],[3.25,4.25,1,4,3],[4.25,4.25,1,4,4],[5.25,4.25,1,4,5],[6.25,4.25,1,4,6],[7.25,4.25,1,4,7],[8.25,4.25,1,4,8],[9.25,4.25,1,4,9],[10.25,4.25,1,4,10],[11.25,4.25,1,4,11],[12.25,4.25,1.75,4,12],[14.25,4.5,1,4,13],[0,5.25,1.25,5,0],[1.25,5.25,1.25,5,1],[2.5,5.25,1.25,5,2],[3.75,5.25,6.25,5,6],[10,5.25,1,5,9],[11,5.25,1,5,10],[12,5.25,1,5,11],[13.25,5.5,1,5,12],[14.25,5.5,1,5,13],[15.25,5.5,1,5,14]];

const U = 42, GAP = 3, ROWS = 6, COLS = 15, LEDS = 81, NO_LED = 0xff, BATCH = 9;
const VID = 0x362d, PID = 0x0303;
const PRESETS = ['#ff0000', '#ff8800', '#ffee00', '#22cc44', '#00bbdd', '#3366ff', '#aa44ff', '#ffffff'];

let dev = null, layer = 1, ledOf = [], colors = [], keymap = [], pending = null;

const $ = id => document.getElementById(id);
const log = (msg, bad) => { $('log').innerHTML = bad ? `<span class="off">${msg}</span>` : msg; };

function ask(bytes) {
  const packet = new Uint8Array(32);
  packet.set(bytes);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { pending = null; reject(new Error('клавиатура не ответила')); }, 1000);
    pending = data => { clearTimeout(timer); resolve(data); };
    dev.sendReport(0, packet).catch(err => { clearTimeout(timer); reject(err); });
  });
}

async function connect() {
  const [picked] = await navigator.hid.requestDevice({
    filters: [{ vendorId: VID, productId: PID, usagePage: 0xff60, usage: 0x61 }],
  });
  if (!picked) return;
  dev = picked;
  if (!dev.opened) await dev.open();
  dev.addEventListener('inputreport', e => {
    const data = new Uint8Array(e.data.buffer);
    if (pending) { const f = pending; pending = null; f(data); }
  });
  $('connect').textContent = 'Подключено';
  for (const id of ['fromKeymap', 'clear', 'read', 'write', 'custom']) $(id).disabled = false;
  await loadAll();
}

async function readLedMap() {
  const grid = [];
  for (let row = 0; row < ROWS; row++) {
    const answer = await ask([0xa8, 0x06, row, 0xff, 0xff, 0xff]);
    grid.push([...answer.slice(3, 3 + COLS)]);
  }
  return grid;
}

async function readKeymap(lay) {
  const size = ROWS * COLS * 2, offset = lay * size;
  const raw = [];
  while (raw.length < size) {
    const chunk = Math.min(28, size - raw.length);
    const at = offset + raw.length;
    const answer = await ask([0x12, (at >> 8) & 0xff, at & 0xff, chunk]);
    raw.push(...answer.slice(4, 4 + chunk));
  }
  const out = [];
  for (let i = 0; i < size; i += 2) out.push((raw[i] << 8) | raw[i + 1]);
  return out;
}

async function readColors(lay) {
  const out = [];
  for (let start = 0; start < LEDS; start += BATCH) {
    const count = Math.min(BATCH, LEDS - start);
    const answer = await ask(lay === 0 ? [0xa8, 0x09, start, count] : [0xa8, 0x42, lay, start, count]);
    for (let i = 0; i < count; i++) {
      out.push([answer[3 + i * 3], answer[4 + i * 3], answer[5 + i * 3]]);
    }
  }
  return out;
}

async function writeColors(lay) {
  for (let start = 0; start < LEDS; start += BATCH) {
    const count = Math.min(BATCH, LEDS - start);
    const flat = [];
    for (let i = 0; i < count; i++) flat.push(...colors[start + i]);
    const head = lay === 0 ? [0xa8, 0x0a, start, count] : [0xa8, 0x43, lay, start, count];
    const answer = await ask([...head, ...flat]);
    if (answer[2] !== 0) throw new Error(`клавиатура отвергла пакет со светодиода ${start}`);
  }
}

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return [Math.round(h / 360 * 255) & 0xff, Math.round(max ? d / max * 255 : 0), Math.round(max * 255)];
}

function hsvToCss([h, s, v]) {
  const H = h / 255 * 360, S = s / 255, V = v / 255;
  const c = V * S, x = c * (1 - Math.abs((H / 60) % 2 - 1)), m = V - c;
  let rgb = [0, 0, 0];
  if (H < 60) rgb = [c, x, 0]; else if (H < 120) rgb = [x, c, 0];
  else if (H < 180) rgb = [0, c, x]; else if (H < 240) rgb = [0, x, c];
  else if (H < 300) rgb = [x, 0, c]; else rgb = [c, 0, x];
  return rgb.map(n => Math.round((n + m) * 255));
}

const hexToHsv = hex => rgbToHsv(
  parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16));

const NAMES = {
  0x28: 'Enter', 0x29: 'Esc', 0x2a: 'Bksp', 0x2b: 'Tab', 0x2c: 'Space', 0x2d: '-', 0x2e: '=',
  0x2f: '[', 0x30: ']', 0x31: '\\', 0x33: ';', 0x34: "'", 0x35: '`', 0x36: ',', 0x37: '.',
  0x38: '/', 0x39: 'Caps', 0x46: 'PrtSc', 0x47: 'ScrLk', 0x48: 'Pause', 0x49: 'Ins',
  0x4a: 'Home', 0x4b: 'PgUp', 0x4c: 'Del', 0x4d: 'End', 0x4e: 'PgDn', 0x4f: '→', 0x50: '←',
  0x51: '↓', 0x52: '↑', 0x53: 'NumLk', 0x54: 'num /', 0x55: 'num *', 0x56: 'num -',
  0x57: 'num +', 0x58: 'num ⏎', 0x63: 'num .',
  0xa8: 'Mute', 0xa9: 'Vol+', 0xaa: 'Vol−', 0xab: 'Next', 0xac: 'Prev', 0xad: 'Stop',
  0xae: 'Play', 0xb5: 'Bright+', 0xb6: 'Bright−',
  0xe0: 'Ctrl', 0xe1: 'Shift', 0xe2: 'Alt', 0xe3: 'Win', 0xe4: 'Ctrl', 0xe5: 'Shift',
  0xe6: 'Alt', 0xe7: 'Win',
};

function keyName(kc) {
  if (kc === 0 || kc === 1) return '';
  if (kc >= 0x04 && kc <= 0x1d) return String.fromCharCode(65 + kc - 0x04);
  if (kc >= 0x1e && kc <= 0x26) return String(kc - 0x1d);
  if (kc === 0x27) return '0';
  if (kc >= 0x3a && kc <= 0x45) return 'F' + (kc - 0x39);
  if (kc >= 0x59 && kc <= 0x61) return 'num ' + (kc - 0x58);
  if (kc === 0x62) return 'num 0';
  if (kc >= 0x7820 && kc <= 0x7840) return 'RGB';
  if (kc >= 0x7e00 && kc <= 0x7e3f) return 'KC' + (kc - 0x7e00);
  if (kc >= 0x5220 && kc <= 0x523f) return 'MO' + (kc - 0x5220);
  return NAMES[kc] || '0x' + kc.toString(16);
}

function ledAt(row, col) {
  const led = ledOf.length ? ledOf[row][col] : NO_LED;
  return led === NO_LED || led >= LEDS ? null : led;
}

function draw() {
  const host = $('keys');
  host.innerHTML = '';
  let maxX = 0, maxY = 0;

  for (const [x, y, w, row, col] of KEYS) {
    const el = document.createElement('div');
    el.className = 'key';
    el.style.left = x * U + 'px';
    el.style.top = y * U + 'px';
    el.style.width = w * U - GAP + 'px';
    el.style.height = U - GAP + 'px';

    const led = ledAt(row, col);
    if (led !== null && colors.length) {
      const [r, g, b] = hsvToCss(colors[led]);
      el.style.background = `rgb(${r},${g},${b})`;
      el.classList.add(r + g + b > 350 ? 'light' : 'dark');
    }
    if (keymap.length) el.textContent = keyName(keymap[row * COLS + col]);

    if (led !== null) {
      el.onclick = () => { colors[led] = hexToHsv($('color').value); draw(); };
      el.oncontextmenu = e => { e.preventDefault(); colors[led] = [0, 0, 0]; draw(); };
    } else {
      el.style.opacity = .35;
      el.style.cursor = 'default';
    }
    host.appendChild(el);
    maxX = Math.max(maxX, (x + w) * U);
    maxY = Math.max(maxY, (y + 1) * U);
  }
  host.style.width = maxX + 'px';
  host.style.height = maxY + 'px';
}

function drawLayers() {
  const host = $('layers');
  host.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const b = document.createElement('button');
    b.textContent = i === 0 ? '0 (базовый)' : i === 1 ? '1 (Fn)' : String(i);
    if (i === layer) b.className = 'on';
    b.onclick = async () => { layer = i; drawLayers(); if (dev) await loadLayer(); };
    host.appendChild(b);
  }
}

async function loadAll() {
  log('читаю карту светодиодов…');
  ledOf = await readLedMap();
  await loadLayer();
}

async function loadLayer() {
  log(`читаю слой ${layer}…`);
  keymap = await readKeymap(layer);
  colors = await readColors(layer);
  const mask = (await ask([0xa8, 0x40]))[3];
  $('custom').checked = layer !== 0 && !!(mask & (1 << layer));
  draw();
  log(`слой ${layer} прочитан. Подписи — то, что назначено в лаунчере.`);
}

function paintAssigned() {
  const brush = hexToHsv($('color').value);
  let lit = 0;
  colors = colors.map(() => [0, 0, 0]);
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const led = ledAt(row, col);
      if (led === null) continue;
      if (keymap[row * COLS + col] > 1) { colors[led] = brush; lit++; }
    }
  }
  draw();
  log(`подсвечено ${lit} назначенных клавиш — нажми «Записать и сохранить»`);
}

async function write() {
  try {
    log('записываю…');
    await writeColors(layer);
    if (layer !== 0) {
      const mask = (await ask([0xa8, 0x40]))[3];
      const next = $('custom').checked ? mask | (1 << layer) : mask & ~(1 << layer);
      await ask([0xa8, 0x41, next]);
    }
    await ask([0xa8, 0x02]);
    log(`слой ${layer} записан и сохранён в память клавиатуры`);
  } catch (err) {
    log(err.message, true);
  }
}

for (const hex of PRESETS) {
  const s = document.createElement('div');
  s.className = 'swatch';
  s.style.background = hex;
  s.onclick = () => { $('color').value = hex; };
  $('swatches').appendChild(s);
}

$('connect').onclick = () => connect().catch(e => log(e.message, true));
$('read').onclick = () => loadLayer().catch(e => log(e.message, true));
$('write').onclick = write;
$('fromKeymap').onclick = paintAssigned;
$('clear').onclick = () => { colors = colors.map(() => [0, 0, 0]); draw(); log('всё погашено — не забудь записать'); };

if (!navigator.hid) {
  $('connect').disabled = true;
  log('В этом браузере нет WebHID — открой страницу в Chrome.', true);
}
drawLayers();
draw();
</script>
